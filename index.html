<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Ελληνικά — греческий с нуля до B2</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&display=swap" rel="stylesheet">
<style>
:root{
--bg:#EDF2F6;--surface:#FFFFFF;--ink:#10263B;--muted:#587184;--line:#D3DFE8;
--sea:#0D5C9E;--sea-deep:#0A3F70;--glass:#2FA79E;--door:#C92A66;
--ok:#2F7D46;--ok-bg:#DFF2E3;--bad:#B83A24;--bad-bg:#FBE4DE;--sun:#E8A317;
--serif:'Literata',Georgia,'Times New Roman',serif;
--sans:'Commissioner',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bg:#0B1620;--surface:#13232F;--ink:#E8F0F5;--muted:#93A9B8;--line:#24384A;--sea:#5AA9E6;--sea-deep:#134B7C;--glass:#4CC9BE;--door:#FF7BA8;--ok:#6CC07E;--ok-bg:#17331F;--bad:#FF8A72;--bad-bg:#3A1E18;--sun:#F2B33D}
}
:root[data-theme="dark"]{--bg:#0B1620;--surface:#13232F;--ink:#E8F0F5;--muted:#93A9B8;--line:#24384A;--sea:#5AA9E6;--sea-deep:#134B7C;--glass:#4CC9BE;--door:#FF7BA8;--ok:#6CC07E;--ok-bg:#17331F;--bad:#FF8A72;--bad-bg:#3A1E18;--sun:#F2B33D}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{margin:0}
.wrap{max-width:520px;margin:0 auto;padding:0 16px 120px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 -16px;padding:12px 16px;background:var(--bg)}
.brand{font:700 27px var(--serif);color:var(--sea);letter-spacing:.01em}
.chips{display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;white-space:nowrap}
.chip.lv{background:var(--sea);border-color:var(--sea);color:#fff;font-size:12px;padding:3px 9px}
:root[data-theme="dark"] .chip.lv{color:#06202F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.lv{color:#06202F}}
.back{border:0;background:none;color:var(--sea);font-weight:700;padding:6px 0;font-size:16px}
.h1{font:700 26px/1.15 var(--serif)}
.sub{color:var(--muted);font-size:14px}
.sec{margin:26px 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec h2{font:600 20px var(--serif)}
.sec span{color:var(--muted);font-size:13px}

/* goal + review */
.goal{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:4px}
.goal b{font-weight:700}
.pbar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%;background:var(--glass);border-radius:8px;transition:width .3s}
.rev{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:12px;padding:14px 16px;border-radius:16px;border:2px solid var(--door);background:transparent;color:var(--door);font-weight:700;font-size:16px;text-align:left}
.rev b{background:var(--door);color:#fff;border-radius:999px;padding:2px 11px}

/* unit list */
.units{display:flex;flex-direction:column;gap:10px}
.unit{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.unit.next{border-color:var(--sea);border-width:2px;padding:11px 13px}
.uic{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--bg);font-family:var(--serif);font-weight:600;color:var(--sea)}
.unit.done .uic{background:var(--ok-bg)}
.ub{flex:1;min-width:0}
.ub b{display:block;font-weight:700}
.ub small{color:var(--muted)}
.tagn{font-size:12px;font-weight:700;color:var(--sea)}

/* plaque */
.plaque{position:relative;background:var(--sea-deep);color:#fff;border-radius:22px;padding:24px 16px 34px;text-align:center;overflow:hidden}
.plaque::after{content:"";position:absolute;left:0;right:0;bottom:0;height:9px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.92) 0 12px,transparent 12px 24px)}
.plaque .em{font-size:64px;line-height:1.1;margin-bottom:6px}
.plaque .em.txt{font:600 54px var(--serif)}
.plaque .gr{font:600 clamp(32px,10.5vw,46px)/1.15 var(--serif);letter-spacing:.01em;word-break:break-word}
.plaque .gr.long{font-size:clamp(22px,6.6vw,28px);line-height:1.3}
.plaque .ru{font:600 clamp(24px,7vw,30px)/1.2 var(--sans)}
.plaque .tr{opacity:.85;font-size:17px;margin-top:6px}
.plaque .big{font:600 78px/1 var(--serif)}
.plaque .big.s{font-size:44px}
.spk{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;padding:9px 16px;margin:14px 4px 0;font-weight:600;font-size:15px}
.spk svg{width:20px;height:20px}
.hero{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.hero .plaque{padding:20px 16px 30px}
.plaque .uh{font:700 26px/1.2 var(--serif)}

/* action rows */
.rows{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.rows.two{grid-template-columns:1fr 1fr}
.act{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 6px;font-weight:600;font-size:14px}
.act span{font-size:24px}
.les{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:8px}
.dot{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--bg);color:var(--sea);border:2px solid var(--line)}
.dot.done{background:var(--ok);border-color:var(--ok);color:#fff}
.les .lt{flex:1;font-weight:600}
.les .lt small{display:block;color:var(--muted);font-weight:400}
.stars{color:var(--sun);letter-spacing:1px;font-size:15px}
.stars .o{color:var(--line)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.navin{max-width:520px;margin:0 auto;display:flex}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:6px 0;font-size:11.5px;font-weight:600;color:var(--muted)}
.nb svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nb.on{color:var(--sea)}

/* lesson */
.ltop{display:flex;align-items:center;gap:12px;padding:12px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.x{border:0;background:none;font-size:26px;line-height:1;color:var(--muted);padding:2px 6px}
.ltop .pbar{flex:1;margin:0;height:12px}
.q{padding-top:8px}
.qt{font:600 20px var(--sans);margin:6px 0 14px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.opt{width:100%;min-height:56px;text-align:left;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:18px;font-weight:500}
.opt.g{font-family:var(--serif);font-size:21px}
.opt.long{font-size:17px}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.foot.ok{background:var(--ok-bg);border-color:var(--ok)}
.foot.bad{background:var(--bad-bg);border-color:var(--bad)}
.fin{max-width:520px;margin:0 auto}
.fmsg{font-weight:700;font-size:19px;margin-bottom:2px}
.foot.ok .fmsg{color:var(--ok)}
.foot.bad .fmsg{color:var(--bad)}
.fans{font:500 19px var(--serif);margin-bottom:10px}
.fans small{display:block;font:400 14px var(--sans);color:var(--muted)}
.btn{display:block;width:100%;padding:15px 18px;border:0;border-radius:14px;background:var(--sea);color:#fff;font-weight:700;font-size:17px;text-align:center}
:root[data-theme="dark"] .btn{color:#06202F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#06202F}}
.foot.ok .btn{background:var(--ok)}
.foot.bad .btn{background:var(--bad)}
:root[data-theme="dark"] .foot.ok .btn,:root[data-theme="dark"] .foot.bad .btn{color:#06202F}
.btn:disabled{opacity:.4}
.btn.alt{background:transparent;color:var(--sea);border:2px solid var(--line)}
.btn+.btn{margin-top:10px}

/* tiles */
.line{min-height:66px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;margin-top:20px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;justify-content:center}
.tile{padding:9px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font:600 21px var(--serif);min-width:44px}
.tile.ghost{opacity:.25;pointer-events:none}
.line .tile{border-color:var(--sea)}
.line.ok .tile{border-color:var(--ok);background:var(--ok-bg)}
.line.bad .tile{border-color:var(--bad);background:var(--bad-bg)}
.plain{text-align:center}
.plain .ru{font:600 26px/1.25 var(--sans)}

/* match */
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.mcol{display:flex;flex-direction:column;gap:10px}
.mb{min-height:56px;padding:8px 10px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:16px;font-weight:500;text-align:center;line-height:1.2}
.mb.g{font-family:var(--serif);font-size:19px}
.mb.sel{border-color:var(--sea);background:var(--bg)}
.mb.gone{opacity:.28;pointer-events:none;border-color:var(--ok)}
.mb.shake{animation:sh .3s;border-color:var(--bad)}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* intro list */
.ilist{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.irow{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;width:100%;text-align:left}
.irow .ie{flex:none;width:48px;text-align:center;font-size:30px}
.irow .ie.t{font:600 26px var(--serif);color:var(--sea)}
.irow .it{flex:1;min-width:0}
.irow .ig{font:600 20px/1.25 var(--serif)}
.irow .itr{color:var(--muted);font-size:14px}
.irow .ir{font-size:15px}

/* result */
.res{text-align:center;padding-top:30px}
.res .stars{font-size:44px;margin:6px 0 4px;letter-spacing:6px}
.res h1{font:700 30px var(--serif)}
.rst{display:flex;gap:10px;margin:22px 0}
.rst div{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 6px}
.rst b{display:block;font:700 24px var(--serif)}
.rst span{color:var(--muted);font-size:13px}

/* cards */
.cdots{display:flex;justify-content:center;gap:5px;margin-top:14px;flex-wrap:wrap}
.cdots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.cdots i.on{background:var(--sea)}
.cnav{display:flex;gap:10px;margin-top:16px}
.cnav .btn{flex:1}

/* scene */
.stage{position:relative;border-radius:22px;overflow:hidden;color:#fff;min-height:330px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(160deg,hsl(var(--h) 55% 30%),hsl(calc(var(--h) + 30) 60% 18%))}
.stage .setg{position:absolute;right:-14px;top:-6px;font-size:150px;opacity:.16;line-height:1}
.cast{display:flex;justify-content:space-between;padding:6px 18px 0;position:relative}
.av{display:flex;flex-direction:column;align-items:center;font-size:56px;line-height:1.1;opacity:.55;transition:opacity .25s}
.av small{font:600 13px var(--sans);opacity:.9;margin-top:2px}
.av.on{opacity:1}
.av.on .f{animation:talk .55s ease-in-out infinite alternate}
@keyframes talk{to{transform:translateY(-7px) scale(1.04)}}
.bubble{position:relative;margin-top:14px;background:rgba(255,255,255,.96);color:#10263B;border-radius:18px;padding:14px 16px;min-height:120px}
.bubble .bg{font:600 22px/1.3 var(--serif)}
.bubble .bt{color:#587184;font-size:14px;margin-top:4px}
.bubble .br{font-size:16px;margin-top:6px;font-weight:600}
.ctl{display:flex;gap:8px;margin-top:12px}
.ctl button{flex:1;padding:12px 0;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:15px}
.ctl .main{flex:2;background:var(--sea);color:#fff;border-color:var(--sea)}
:root[data-theme="dark"] .ctl .main{color:#06202F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ctl .main{color:#06202F}}
.slines{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.sl{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.sl.on{border-color:var(--sea);border-width:2px;padding:9px 11px}
.sl .a{font-size:26px}
.sl .t b{font:600 17px/1.3 var(--serif);display:block}
.sl .t span{color:var(--muted);font-size:14px}

/* grammar / text */
.gram{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
.gram h3{font:600 19px var(--serif);margin:12px 0 8px}
.gram h3:first-child{margin-top:0}
.gram p{margin:8px 0}
.gt{width:100%;border-collapse:collapse;margin:8px 0;font-size:16px}
.gt td,.gt th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.gt th{color:var(--muted);font-weight:600;font-size:13px}
.gt td:first-child{font-family:var(--serif);font-weight:600}

/* alphabet */
.agrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ag{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 2px;text-align:center}
.ag b{display:block;font:600 26px var(--serif)}
.ag small{color:var(--muted);font-size:12px}
.ag.on{border:2px solid var(--sea);padding:9px 1px}
.adet{margin-top:6px}
.adet .plaque{padding-bottom:30px}
.adet .wx{margin-top:10px;font:600 22px var(--serif)}
.adet .nt{margin-top:8px;font-size:15px;opacity:.92}

/* words tab */
.search{width:100%;padding:13px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:17px;margin-top:6px}
.search:focus{outline:none;border-color:var(--sea)}
.wrow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 4px;border:0;border-bottom:1px solid var(--line);background:none}
.wrow .we{width:34px;text-align:center;font-size:22px}
.wrow .wt{flex:1;min-width:0}
.wrow .wg{font:600 18px var(--serif)}
.wrow .wr{color:var(--muted);font-size:14px}
.m5{display:flex;gap:2px}
.m5 i{width:6px;height:14px;border-radius:2px;background:var(--line)}
.m5 i.on{background:var(--glass)}
.wrow.locked .wg,.wrow.locked .wr{opacity:.55}

/* me */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.st{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.st b{font:700 26px var(--serif);display:block}
.st span{color:var(--muted);font-size:13px}
.lvbar{margin-top:10px}
.lvbar div{display:flex;justify-content:space-between;font-size:14px}
.set{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px 16px;margin-top:8px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border:0}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;padding:7px 11px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--sea);color:#fff}
:root[data-theme="dark"] .seg button.on{color:#06202F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button.on{color:#06202F}}
.tgl{width:50px;height:30px;border-radius:999px;border:0;background:var(--line);position:relative;padding:0}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.tgl.on{background:var(--glass)}
.tgl.on::after{left:23px}
.note{background:var(--bad-bg);border-radius:14px;padding:10px 14px;font-size:14px;margin-top:10px}
.note.info{background:var(--surface);border:1px solid var(--line)}
textarea.code{width:100%;min-height:90px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:12px monospace;padding:8px;margin-top:8px}
.empty{text-align:center;color:var(--muted);padding:30px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root[data-theme="dark"] .btn.alt{color:var(--sea)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.alt{color:var(--sea)}}

</style>
</head>
<body>
<div id="app"></div>
<noscript>Для работы приложения нужен JavaScript.</noscript>
<script>
/* ===== DATA ===== */
// letter: [up, lo, name, ruName, sound, exampleWord, ru, emoji, note]
const LET=[
['Α','α','άλφα','альфа','а','αγόρι','мальчик','👦','Как «а» в слове «мама».'],
['Β','β','βήτα','вита','в','βιβλίο','книга','📖','Как русское «в».'],
['Γ','γ','γάμμα','гамма','г / й','γάτα','кошка','🐈','Мягкое «г» (как в украинском). Перед е и и читается как «й»: γεια = «йа».'],
['Δ','δ','δέλτα','дельта','th (this)','δέντρο','дерево','🌳','Звонкий «th» как в английском this: кончик языка между зубами.'],
['Ε','ε','έψιλον','эпсилон','э','ελιά','олива','🫒','Как «э» в слове «это».'],
['Ζ','ζ','ζήτα','зита','з','ζέβρα','зебра','🦓','Как русское «з».'],
['Η','η','ήτα','ита','и','ήλιος','солнце','☀️','Читается как «и».'],
['Θ','θ','θήτα','фита','th (think)','θάλασσα','море','🌊','Глухой «th» как в английском think: язык между зубами.'],
['Ι','ι','γιώτα','йота','и','ιστορία','история','📜','Читается как «и».'],
['Κ','κ','κάπα','каппа','к','καφές','кофе','☕','Как русское «к».'],
['Λ','λ','λάμδα','лямбда','л','λεμόνι','лимон','🍋','Как «л» в слове «лето».'],
['Μ','μ','μι','ми','м','μήλο','яблоко','🍎','Как русское «м».'],
['Ν','ν','νι','ни','н','νερό','вода','💧','Как русское «н».'],
['Ξ','ξ','ξι','кси','кс','ξενοδοχείο','отель','🏨','Читается «кс».'],

'use strict';
/* ===== helpers ===== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const pick1=a=>a[rnd(a.length)];
const nfc=s=>String(s).normalize('NFC');
const strip=s=>nfc(s).toLowerCase().replace(/[.,!;?·«»"'…—\-]/g,'').replace(/\s+/g,' ').trim();
const normS=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ds(new Date());
const yest=()=>{const d=new Date();d.setDate(d.getDate()-1);return ds(d)};
const DAY=86400000;

/* ===== transliteration (Greek -> Russian letters, stress in capitals) ===== */
function translit(src){
  const s=nfc(src).toLowerCase().replace(/ς/g,'σ');
  const BASE={'ά':'α','έ':'ε','ή':'η','ί':'ι','ό':'ο','ύ':'υ','ώ':'ω','ϊ':'ι','ϋ':'υ','ΐ':'ι','ΰ':'υ'};
  const ST='άέήίόύώΐΰ',DI='ϊϋΐΰ';
  const cs=[...s].map(c=>({c,b:BASE[c]||c,st:ST.includes(c),di:DI.includes(c)}));
  const M={α:'а',β:'в',γ:'г',δ:'д',ε:'э',ζ:'з',η:'и',θ:'т',ι:'и',κ:'к',λ:'л',μ:'м',ν:'н',ξ:'кс',ο:'о',π:'п',ρ:'р',σ:'с',τ:'т',υ:'и',φ:'ф',χ:'х',ψ:'пс',ω:'о'};
  const V='αεηιουω',VOICED='αεηιουωβγδζλμνρ';
  const isG=ch=>/^[α-ω]$/.test(ch);
  const cap=(t,st)=>st?t.charAt(0).toUpperCase()+t.slice(1):t;
  let out='';
  for(let i=0;i<cs.length;i++){
    const a=cs[i],b=cs[i+1],c2=cs[i+2];
    if(!isG(a.b)){out+=a.c===';'?'?':a.c;continue}
    const start=i===0||!isG(cs[i-1].b);
    const p=(b&&isG(b.b)&&!a.di&&!b.di)?a.b+b.b:'';
    let t=null,adv=2,st=a.st||(b&&b.st);
    if(['αι','οι','ει','υι'].includes(p)&&a.st&&!b.st){t=M[a.b]+'й';st=true}
    else switch(p){
      case 'ου':t='у';break;
      case 'ει':case 'οι':case 'υι':t='и';break;
      case 'αι':t='э';break;
      case 'αυ':case 'ευ':{const nx=c2&&isG(c2.b)?c2.b:'';t=(p==='αυ'?'а':'э')+(nx&&VOICED.includes(nx)?'в':'ф');break}
      case 'μπ':t=start?'б':'мб';break;
      case 'ντ':t=start?'д':'нд';break;
      case 'γκ':t=start?'г':'нг';break;
      case 'γγ':t='нг';break;
      case 'γχ':t='нх';break;
      case 'τσ':t='ц';break;
      case 'τζ':t='дж';break;
      default:adv=1;
    }
    if(t===null){
      st=a.st;
      t=M[a.b]||a.c;
      if(a.b==='γ'&&b&&!b.di&&'ειηυ'.includes(b.b)){
        t='й';
        if(b.b==='ι'&&c2&&V.includes(c2.b)&&!c2.di){adv=2}
      }
    }
    out+=cap(t,st);i+=adv-1;
  }
  return out;
}

function chunk(arr,max){
  const k=Math.ceil(arr.length/max),size=Math.ceil(arr.length/k),out=[];
  for(let i=0;i<arr.length;i+=size)out.push(arr.slice(i,i+size));

}

function speak(text,o={}){
  if(!('speechSynthesis' in window)){audioErr='nosupport';if(o.cb)setTimeout(o.cb,1500);return}
  if(!voice)pickVoice();
  const slow=o.slow||S.set.slow;
  const busy=speechSynthesis.speaking||speechSynthesis.pending;
  stopAudio();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='el-GR';if(voice)u.voice=voice;u.rate=slow?0.6:0.86;u.volume=1;
  let done=false;
  const fin=()=>{if(done)return;done=true;if(o.cb)o.cb()};
  u.onstart=()=>{audioErr=''};
  u.onend=fin;
  u.onerror=e=>{audioErr=(e&&e.error)||'error';fin()};
  if(o.cb)setTimeout(fin,Math.max(1600,text.length*(slow?190:130)+900));
  const run=()=>{try{speechSynthesis.resume();speechSynthesis.speak(u)}catch(e){audioErr='error';fin()}};
  if(busy)setTimeout(run,60);else run();
}

function dw(w,n,needE){
  const seen=new Set([w.ru,w.g]),out=[];
  const pools=[shuffle(w.u.words),shuffle(ALLW.filter(x=>x.u!==w.u&&LV[x.u.lvl]<=LV[w.u.lvl]))];
  for(const pl of pools)for(const x of pl){
    if(out.length>=n)break;
    if(x.id===w.id||seen.has(x.ru)||seen.has(x.g)||(needE&&!x.e))continue;
    seen.add(x.ru);seen.add(x.g);out.push(x);

function dp(p,n){

    if(out.length>=n)break;

}

function qGap(p){

  const more=shuffle(ALLP.filter(x=>x.u!==p.u).flatMap(x=>tok(x.g))).filter(x=>x!==ans&&!ds.includes(x));

/* lesson builders */
function reviewFor(u,les,n){
  const prevU=(u.words||[]).filter(w=>!les.items.includes(w)&&S.words[w.id]);
  let pool=prevU.length>=n?prevU:prevU.concat(dueWords().filter(w=>w.u!==u&&!prevU.includes(w)));
  return shuffle(pool).slice(0,n).map(w=>Math.random()<.5?qG2R(w):qR2G(w));
}
function buildWords(u,les){
  const ws=les.items,hard=LV[u.lvl]>=2||u.ix>=16;
  const qs=[];
  shuffle(ws).slice(0,5).forEach(w=>qs.push(hard?(Math.random()<.5?qR2G(w):qListen(w,'ru')):(w.e&&Math.random()<.55?qPic(w):qG2R(w))));
  qs.push(qMatch(shuffle(ws)));
  shuffle(ws).slice(0,3).forEach((w,i)=>qs.push(i%2?qR2G(w):qListen(w,(les.idx>0||hard)?'g':'ru')));
  shuffle(ws).slice(0,3).forEach(w=>{
    if(['ο','η','το'].includes(w.art)&&Math.random()<.5)qs.push(qArt(w));
    else if(canSpell(w))qs.push(qSpell(w));
    else qs.push(qListen(w,'g'));
  });
  return qs.concat(reviewFor(u,les,2));
}
function buildPhr(u,les){
  const ps=les.items,qs=[];
  shuffle(ps).slice(0,3).forEach(p=>qs.push(qPG2R(p)));
  const s=shuffle(ps);
  qs.push(qPListen(s[0]),qPR2G(s[1]||s[0]),qPR2G(s[2]||s[0]));
  qs.push(qBuild(s[3%s.length]),qBuild(s[4%s.length]),qBuild(s[0],true));
  qs.push(qGap(s[1%s.length]),qGap(s[2%s.length]));
  return qs.concat(reviewFor(u,{items:[]},2));
}
function buildTest(u){
  const ws=shuffle(u.words),ps=shuffle(u.phrases),qs=[];
  ws.slice(0,2).forEach(w=>qs.push(qListen(w,'g')));
  ws.slice(2,4).forEach(w=>qs.push(qR2G(w)));
  ws.slice(4,7).forEach(w=>qs.push(canSpell(w)?qSpell(w):qG2R(w)));
  const nouns=ws.filter(w=>['ο','η','το'].includes(w.art));
  if(nouns.length)qs.push(qArt(nouns[0]));
  qs.push(qMatch(ws.slice(7,12).length>=4?ws.slice(7,12):ws.slice(0,5)));
  qs.push(qBuild(ps[0]),qBuild(ps[1]),qGap(ps[2]||ps[0]),qPListen(ps[3]||ps[0]));
  return shuffle(qs);
}
function buildLet(u,les){
  const ls=les.items,qs=[];
  shuffle(ls).forEach(l=>qs.push(qL2S(l)));
  shuffle(ls).forEach(l=>qs.push(Math.random()<.5?qLFirst(l):qS2L(l)));
  qs.push(qLMatch(shuffle(ls)));
  shuffle(ls).slice(0,2).forEach(l=>qs.push(l.kind==='letter'?qLName(l):qS2L(l)));
  return qs;
}
function buildLetTest(u,les){
  const prevU=COURSE.filter(x=>x.kind==='letters'&&x.items[0].kind===u.items[0].kind&&x.ix<u.ix);
  const prev=prevU.length?prevU[prevU.length-1].items:[];
  const ls=shuffle(u.items.concat(prev)),qs=[];
  ls.slice(0,4).forEach(l=>qs.push(qLFirst(l,true)));
  ls.slice(2,6).forEach(l=>qs.push(qS2L(l)));
  ls.slice(0,2).forEach(l=>qs.push(l.w.length<=10?qLSpell(l):qL2S(l)));
  qs.push(qLMatch(ls.slice(0,5)));
  return shuffle(qs);

function qFor(w){
  const s=S.words[w.id],b=s?s.b:0;
  if(b<2)return w.e&&Math.random()<.5?qPic(w):qG2R(w);
  if(b<4)return Math.random()<.5?qR2G(w):qListen(w,'ru');
  if(canSpell(w)&&Math.random()<.6)return qSpell(w);
  return ['ο','η','το'].includes(w.art)&&Math.random()<.5?qArt(w):qListen(w,'g');
}

}
function unpack(o){
  const d=def();
  if(o.v===1)return Object.assign(d,o,{set:Object.assign(d.set,o.set||{})});
  Object.assign(d,{ts:o.ts||0,xp:o.xp||0,streak:o.streak||0,last:o.last||'',days:o.days||{},set:Object.assign(d.set,o.set||{})});
  Object.keys(o.words||{}).forEach(id=>{const w=o.words[id];d.words[id]={b:w[0],d:w[1]*1000,ok:0,no:0}});
  Object.keys(o.lessons||{}).forEach(id=>{d.lessons[id]={done:1,stars:o.lessons[id],acc:0,t:0}});

}

  if(p.big)h+=`<div class="big${p.big.length>4?' s':''}">${esc(p.big)}</div>`;

  if(p.listen&&!p.g)h+='<div class="em">🎧</div>';

  return h+'</div>';

const curQ=()=>L.qs[L.i];
function rChoice(q){
  const cls=o=>{
    let c='opt'+(q.optG?' g':'')+(q.optL&&o.t.length>26?' long':'');
    if(L.fb){if(o.v===q.ans)c+=' right';else if(q.sel!==null&&q.opts[q.sel]===o)c+=' wrong'}
    return c;
  };
  return `<div class="q"><h2 class="qt">${esc(q.t)}</h2>${pHTML(q.prompt)}<div class="opts">${q.opts.map((o,i)=>`<button class="${cls(o)}" data-act="opt" data-i="${i}" ${L.fb?'disabled':''}>${esc(o.t)}</button>`).join('')}</div></div>`;
}
function rTiles(q){
  const used=q.st.a;
  const cls=q.st.res?' '+q.st.res:'';
  return `<div class="q"><h2 class="qt">${esc(q.t)}</h2>${pHTML(q.prompt)}<div class="line${cls}">${used.map((id,pos)=>`<button class="tile" data-act="ta" data-p="${pos}" ${L.fb?'disabled':''}>${esc(q.bank.find(b=>b.id===id).t)}</button>`).join('')}</div><div class="bank">${q.bank.map(b=>`<button class="tile ${used.includes(b.id)?'ghost':''}" data-act="tb" data-id="${b.id}">${esc(b.t)}</button>`).join('')}</div></div>`;
}
function rMatch(q){
  const st=q.st;
  const left=q.pairs.map((p,i)=>`<button class="mb g ${st.done.includes(i)?'gone':''} ${st.sl===i?'sel':''} ${st.shk&&st.shk.l===i?'shake':''}" data-act="ml" data-i="${i}">${esc(p.g)}</button>`).join('');
  const right=q.order.map((pi,j)=>`<button class="mb ${st.done.includes(pi)?'gone':''} ${st.sr===j?'sel':''} ${st.shk&&st.shk.r===j?'shake':''}" data-act="mr" data-j="${j}">${esc(q.pairs[pi].r)}</button>`).join('');
  return `<div class="q"><h2 class="qt">${esc(q.t)}</h2><div class="sub">Нажмите слово, затем его перевод.</div><div class="mcols"><div class="mcol">${left}</div><div class="mcol">${right}</div></div></div>`;
}
const PRAISE=['Верно!','Отлично!','Точно!','Так держать!','Хорошо!'];
function footHTML(q){
  if(L.fb){
    const r=L.fb.right;
    let ans='';
    if(!r&&q.corr){ans=`<div class="fans">${esc(q.corr)}${q.sub?`<small>${esc(q.sub)}</small>`:''}</div>`}
    else if(r&&q.sub&&q.k!=='match'){ans=`<div class="fans"><small>${esc(q.sub)}</small></div>`}
    return `<div class="foot ${r?'ok':'bad'}"><div class="fin"><div class="fmsg">${r?pick1(PRAISE):(q.k==='match'?'Пары найдены, но были ошибки':'Правильный ответ:')}</div>${ans}<button class="btn" data-act="next">Дальше</button></div></div>`;
  }
  if(q.k==='tiles')return `<div class="foot"><div class="fin"><button class="btn" data-act="check" ${q.st.a.length?'':'disabled'}>Проверить</button></div></div>`;
  return '';
}
function vLesson(){
  const q=curQ(),pct=Math.round(L.i/L.qs.length*100);
  const body=q.k==='choice'?rChoice(q):q.k==='tiles'?rTiles(q):rMatch(q);
  return `<div class="wrap"><div class="ltop"><button class="x" data-act="quit" aria-label="Выйти">✕</button><div class="pbar"><i style="width:${pct}%"></i></div></div>${body}</div>${footHTML(q)}`;
}
function introRows(les){
  return les.items.map(x=>{
    if(x.kind){
      const isL=x.kind==='letter';
      return `<div class="irow"><span class="ie t">${esc(x.glyph.replace(' ς',''))}</span><span class="it"><div class="ig">${isL?esc(x.name)+' · «'+esc(x.ruName)+'»':'звук «'+esc(x.snd)+'»'}</div><div class="ir">Звук: <b>${esc(x.snd)}</b>. ${esc(x.note)}</div><div class="itr">${x.e} ${esc(x.w)} — ${esc(x.wr)}</div></span><span>${isL?`<button class="spk" style="background:var(--bg);color:var(--sea);margin:2px" data-act="say" data-t="${esc(x.name)}">${ICON_SPK}</button>`:''}<button class="spk" style="background:var(--bg);color:var(--sea);margin:2px" data-act="say" data-t="${esc(x.w)}">${ICON_SPK}</button></span></div>`;
    }
    const em=x.type==='w'?`<span class="ie">${esc(x.e||'·')}</span>`:'<span class="ie">💬</span>';
    return `<button class="irow" data-act="say" data-t="${esc(x.g)}">${em}<span class="it"><div class="ig">${esc(x.g)}</div>${S.set.tr?`<div class="itr">${esc(x.tr)}</div>`:''}<div class="ir">${esc(x.ru)}</div></span><span style="color:var(--sea)">${ICON_SPK}</span></button>`;
  }).join('');
}
function vIntro(){
  const les=L.les,u=L.u;
  const title=les.kind==='phr'?'Новые фразы':les.kind==='let'?'Знакомимся':'Новые слова';
  return `<div class="wrap"><div class="top"><button class="back" data-act="quit">‹ Назад</button><span class="chip">${esc(les.t)}</span></div><div class="h1">${title}</div><div class="sub">Нажимайте на строки, чтобы услышать произношение. Потом начнём упражнения.</div><div class="ilist">${introRows(les)}</div></div><div class="foot"><div class="fin"><button class="btn" data-act="begin">Начать упражнения</button></div></div>`;
}
function vResult(){
  const r=V;
  const msg=!r.pass?'Почти получилось':r.stars===3?'Без ошибок!':r.stars===2?'Отличная работа':'Урок пройден';
  return `<div class="wrap res"><div class="stars">${'★'.repeat(r.pass?r.stars:0)}<span class="o">${'★'.repeat(3-(r.pass?r.stars:0))}</span></div><h1>${msg}</h1><div class="sub">${r.pass?'Прогресс сохранён.':'Для зачёта нужно набрать 70%. Повторите слова и попробуйте ещё раз.'}</div><div class="rst"><div><b>+${r.xp}</b><span>XP</span></div><div><b>${Math.round(r.acc*100)}%</b><span>точность</span></div><div><b>${r.ok}/${r.ok+r.bad}</b><span>с первой попытки</span></div></div><div class="foot"><div class="fin"><button class="btn" data-act="resdone">Продолжить</button>${r.pass?'':'<button class="btn alt" data-act="retry">Ещё раз</button>'}</div></div></div>`;
}

function render(){
  applyTheme();
  const app=$('#app');
  let h='';
  switch(V.n){
    case 'home':h=vHome();break;
    case 'unit':h=vUnit();break;
    case 'cards':h=vCards();break;
    case 'scene':h=vScene();break;
    case 'gram':h=vGram();break;
    case 'alpha':h=vAlpha();break;
    case 'words':h=vWords();break;
    case 'me':h=vMe();break;
    case 'intro':h=vIntro();break;
    case 'lesson':h=vLesson();break;
    case 'result':h=vResult();break;
  }
  app.innerHTML=h;
  tgSync();
}

/* ===== lesson engine ===== */
function newL(u,les,qs){return {u,les,qs,i:0,ok:0,bad:0,fb:null,wst:{}}}
function startLesson(u,les){
  L=newL(u,les,[]);
  if(['words','phr','let'].includes(les.kind))go('intro');
  else begin();
}
function begin(){
  const {u,les}=L;
  L.qs=les.kind==='words'?buildWords(u,les):les.kind==='phr'?buildPhr(u,les):les.kind==='test'?buildTest(u,les):les.kind==='let'?buildLet(u,les):buildLetTest(u,les);
  L.i=0;L.fb=null;L.ok=0;L.bad=0;L.wst={};
  go('lesson');autoQ();
}
function startReview(){
  const ws=dueWords().slice(0,10);
  if(!ws.length)return;
  L=newL(null,{id:'review',kind:'review',t:'Повторение'},shuffle(ws.map(qFor)));
  go('lesson');autoQ();
}
function autoQ(){
  const q=curQ();
  if(q&&q.prompt&&(q.prompt.say||q.prompt.listen))speak(q.prompt.say||q.prompt.listen);
}
function mark(q,right){
  if(q.k==='match')return;
  const s=L.wst[q.wid]||(L.wst[q.wid]={w:false});
  if(!right&&!q.re)s.w=true;
}
function finishQ(q,right){
  L.fb={right};
  if(TG&&TG.HapticFeedback){try{TG.HapticFeedback.notificationOccurred(right?'success':'error')}catch(e){}}
  if(!q.re){right?L.ok++:L.bad++}
  mark(q,right);
  if(!right&&!q.re&&q.k!=='match'){
    const c=Object.assign({},q,{re:true,sel:null});
    if(q.k==='tiles')c.st={a:[]};
    L.qs.push(c);
  }
  if(q.say&&q.k!=='match')speak(q.say);
  render();
}
function finishLesson(){
  const {les}=L,n=L.ok+L.bad,acc=n?L.ok/n:1;
  const stars=L.bad===0?3:L.bad<=2?2:1;
  const isTest=les.kind==='test'||les.kind==='lettest';
  const pass=isTest?acc>=0.7:true;
  let xp=0;
  if(pass){
    applySRS();
    xp=(les.id==='review'?5:10)+L.ok*2;
    if(les.id!=='review'){
      const prior=S.lessons[les.id];
      S.lessons[les.id]={done:1,stars:Math.max(stars,prior&&prior.stars||0),acc:Math.round(acc*100),t:Date.now()};
    }
    S.xp+=xp;S.days[today()]=(S.days[today()]||0)+xp;
    bump();
  }else applySRS();
  save();
  L.res={acc,stars,xp,pass,ok:L.ok,bad:L.bad};
  go('result',L.res);
}

/* ===== actions ===== */
const ACT={
  tab:el=>go(el.dataset.t),
  unit:el=>go('unit',{id:el.dataset.id}),
  cards:el=>{go('cards',{id:el.dataset.id,i:0});const u=byId(el.dataset.id);speak(u.words[0].g)},
  cprev:()=>{if(V.i>0){go('cards',{id:V.id,i:V.i-1});speak(byId(V.id).words[V.i].g)}},
  cnext:()=>{const u=byId(V.id);if(V.i>=u.words.length-1)go('unit',{id:V.id});else{go('cards',{id:V.id,i:V.i+1});speak(u.words[V.i].g)}},
  scene:el=>{SC={i:0,playing:false,gen:0};go('scene',{id:el.dataset.id})},
  scplay:()=>{if(SC.playing){SC.playing=false;SC.gen++;stopAudio();scShow(SC.i)}else scPlay(SC.i)},
  scprev:()=>{const i=Math.max(0,SC.i-1);if(SC.playing)scPlay(i);else{SC.gen++;scShow(i);speak(byId(V.id).d[i][1])}},
  scnext:()=>{const u=byId(V.id),i=Math.min(u.d.length-1,SC.i+1);if(SC.playing)scPlay(i);else{SC.gen++;scShow(i);speak(u.d[i][1])}},
  scline:el=>{const i=+el.dataset.i;SC.playing=false;SC.gen++;scShow(i);speak(byId(V.id).d[i][1])},
  gram:el=>go('gram',{id:el.dataset.id}),
  say:el=>speak(el.dataset.t,{slow:!!el.dataset.slow}),
  wsay:el=>speak(el.dataset.t),
  testsound:()=>{speak('Καλημέρα!');setTimeout(()=>{if(V.n==='me')render()},1500)},
  alsel:el=>{go('alpha',{a:el.dataset.id});const l=ALLL.find(x=>x.id===el.dataset.id);speak(l.kind==='letter'?l.name:l.w)},
  lesson:el=>{const u=COURSE.find(x=>x.lessons.some(l=>l.id===el.dataset.id));startLesson(u,u.lessons.find(l=>l.id===el.dataset.id))},
  begin:()=>begin(),
  review:()=>startReview(),
  quit:()=>{stopAudio();if(L&&L.u)go('unit',{id:L.u.id});else go('home')},
  opt:el=>{if(L.fb)return;const q=curQ(),i=+el.dataset.i;q.sel=i;finishQ(q,q.opts[i].v===q.ans)},
  tb:el=>{const q=curQ();if(L.fb)return;const id=+el.dataset.id;if(!q.st.a.includes(id)){q.st.a.push(id);render()}},
  ta:el=>{const q=curQ();if(L.fb)return;q.st.a.splice(+el.dataset.p,1);render()},
  check:()=>{
    const q=curQ();if(L.fb||!q.st.a.length)return;
    const ans=q.st.a.map(id=>q.bank.find(b=>b.id===id).t).join(q.join);
    const right=strip(ans)===strip(q.sol.join(q.join));
    q.st.res=right?'ok':'bad';
    finishQ(q,right);
  },
  ml:el=>{const q=curQ();if(L.fb)return;const i=+el.dataset.i;if(q.st.done.includes(i))return;q.st.sl=q.st.sl===i?null:i;if(q.pairs[i].gr)speak(q.pairs[i].g);matchTry(q);render()},
  mr:el=>{const q=curQ();if(L.fb)return;const j=+el.dataset.j;if(q.st.done.includes(q.order[j]))return;q.st.sr=q.st.sr===j?null:j;matchTry(q);render()},
  next:()=>{L.fb=null;L.i++;if(L.i>=L.qs.length)finishLesson();else{render();window.scrollTo(0,0);autoQ()}},
  resdone:()=>{if(L.u)go('unit',{id:L.u.id});else go('home')},
  retry:()=>{begin()},
  tgl:el=>{S.set[el.dataset.k]=!S.set[el.dataset.k];save();render()},
  set:el=>{S.set[el.dataset.k]=el.dataset.v;save();render()},
  showcode:()=>{
    if(V.showCode){
      const t=$('#code');t.select();
      try{navigator.clipboard.writeText(t.value).then(()=>{V.msg='Код скопирован.';render()},()=>{document.execCommand&&document.execCommand('copy')})}catch(e){try{document.execCommand('copy')}catch(_){}}
    }else{V.showCode=true;render()}
  },
  import:()=>{
    const v=($('#imp').value||'').trim();
    try{
      const o=JSON.parse(decodeURIComponent(escape(atob(v))));
      if(!o||(o.v!==1&&o.v!==2)||typeof o.words!=='object')throw 0;
      S=unpack(o);save();V.msg='Прогресс восстановлен.';render();
    }catch(e){V.msg='Не удалось прочитать код. Проверьте, что он скопирован полностью.';render()}
  },
  reset1:()=>{V.confirm=true;render()},
  reset0:()=>{V.confirm=false;render()},
  reset2:()=>{S=def();save();V.confirm=false;V.msg='Прогресс сброшен.';render()}
};
function matchTry(q){
  const st=q.st;
  if(st.sl===null||st.sr===null)return;
  const pi=q.order[st.sr];
  if(pi===st.sl){
    st.done.push(pi);st.sl=null;st.sr=null;
    if(st.done.length===q.pairs.length){
      q.pairs.forEach(p=>{if(!L.wst[p.id])L.wst[p.id]={w:false}});
      setTimeout(()=>{if(curQ()===q&&!L.fb)finishQ(q,st.miss===0)},350);
    }
  }else{
    st.miss++;
    const pr=q.pairs[st.sl];
    (L.wst[pr.id]||(L.wst[pr.id]={w:false})).w=true;
    q.pairs.forEach(p=>{if(!L.wst[p.id])L.wst[p.id]={w:false}});
    st.shk={l:st.sl,r:st.sr};st.sl=null;st.sr=null;
    setTimeout(()=>{if(q.st.shk){q.st.shk=null;if(V.n==='lesson'&&curQ()===q&&!L.fb)render()}},450);
  }
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el||el.disabled)return;
  const f=ACT[el.dataset.act];
  if(f){e.preventDefault();f(el)}
});
document.addEventListener('input',e=>{
  if(e.target&&e.target.id==='q'){V.q=e.target.value;const w=$('#wl');if(w)w.innerHTML=wordsList()}
});


/* ===== Telegram Mini App ===== */
const TGS={st:TG?'init':'off'};
const CS=(TG&&TG.CloudStorage&&TG.isVersionAtLeast&&TG.isVersionAtLeast('6.9'))?TG.CloudStorage:null;
let tgTimer=null,tgBusy=false,tgDirty=false;
function tgSync(){
  if(!TG)return;
  try{
    if(['unit','cards','scene','gram','intro','lesson','result'].includes(V.n))TG.BackButton.show();
    else TG.BackButton.hide();
  }catch(e){}
}
function tgBack(){
  if(V.n==='unit')go('home');
  else if(['cards','scene','gram'].includes(V.n))go('unit',{id:V.id});
  else if(V.n==='intro'||V.n==='lesson')ACT.quit();
  else if(V.n==='result')ACT.resdone();
}
const csGet=k=>new Promise(r=>CS.getItem(k,(e,v)=>r(e?null:v)));
const csGetMany=ks=>new Promise(r=>CS.getItems(ks,(e,v)=>r(e?null:v)));
const csSet=(k,v)=>new Promise(r=>CS.setItem(k,v,(e,ok)=>r(!e&&!!ok)));
function tgPush(){
  if(!CS||TGS.st==='init'||TGS.st==='off')return;
  tgDirty=true;clearTimeout(tgTimer);tgTimer=setTimeout(tgFlush,1500);
}
async function tgFlush(){
  if(!CS||tgBusy||!tgDirty)return;
  tgBusy=true;tgDirty=false;
  try{
    const str=JSON.stringify(pack()),parts=[];
    for(let i=0;i<str.length;i+=3500)parts.push(str.slice(i,i+3500));
    let ok=true;
    for(let i=0;i<parts.length&&ok;i++)ok=await csSet('p_'+i,parts[i]);
    if(ok)ok=await csSet('p_n',String(parts.length));
    TGS.st=ok?'on':'err';if(!ok)tgDirty=true;
  }catch(e){TGS.st='err';tgDirty=true}
  tgBusy=false;
  if(V.n==='me')render();
}
async function tgInit(){
  if(!TG)return;
  try{
    TG.ready();TG.expand();
    if(TG.isVersionAtLeast&&TG.isVersionAtLeast('7.7'))TG.disableVerticalSwipes();
    TG.BackButton.onClick(tgBack);
    TG.onEvent('themeChanged',()=>{lastBar='';render()});
  }catch(e){}
  if(!CS){TGS.st='off';return}
  try{
    let adopted=false;
    const n=parseInt(await csGet('p_n'),10);
    if(n>0&&n<=20){
      const keys=[...Array(n).keys()].map(i=>'p_'+i);
      const vals=await csGetMany(keys);
      if(vals){
        const o=JSON.parse(keys.map(k=>vals[k]||'').join(''));
        if(o&&o.v===2&&(o.ts||0)>(S.ts||0)){
          S=unpack(o);
          try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
          adopted=true;
        }
      }
    }
    TGS.st='on';
    if(!adopted&&(S.ts||0)>0){tgDirty=true;tgFlush()}
    if(V.n==='home'||V.n==='me')render();
  }catch(e){TGS.st='err';if(V.n==='me')render()}
}
window.addEventListener('pagehide',()=>{clearTimeout(tgTimer);tgFlush()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){clearTimeout(tgTimer);tgFlush()}});
render();
tgInit();

</script>
